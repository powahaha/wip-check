<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็คสต็อก WIP ประจำเดือน</title>
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#1B2430; --muted:#46515F; --line:#D5DBE3;
  --navy:#17406F; --ok-bg:#DCF3E4; --ok-fg:#14532D; --tol-bg:#FFF1C7; --tol-fg:#6B4B00;
  --bad-bg:#FDE0DC; --bad-fg:#8F1D12; --wait-bg:#E4E8EE; --wait-fg:#3B4655;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Leelawadee UI","Noto Sans Thai","Sarabun",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
h1,h2,h3{margin:0}
.hdr{display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 20px;color:#fff;background:var(--hc,var(--navy));position:sticky;top:0;z-index:5}
.hdr .title{flex:1;font-size:22px;font-weight:700}
.hdr .who{font-size:15px;opacity:.95;text-align:right}
.btn{min-height:48px;padding:0 20px;border:0;border-radius:12px;font-weight:700;background:var(--navy);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:3px solid var(--navy)}
.btn.ghost{background:rgba(255,255,255,.2);color:#fff;font-weight:500}
.btn.danger{background:#8F1D12;color:#fff}
.btn.big{min-height:64px;font-size:22px;border-radius:16px}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g3,.g2,.g4{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:170px;padding:22px;border:0;border-radius:20px;text-align:left;color:#fff;background:var(--tc,var(--navy))}
.tile .tn{font-size:28px;font-weight:700;line-height:1.25}
.tile .ts{font-size:16px;opacity:.95}
.tile.off{background:#E3E7ED;color:#4A5565;border:2px dashed #9AA5B4}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.pbar>i{display:block;height:8px;background:#fff}
.card{background:var(--card);border-radius:16px;padding:18px 20px}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.tol{background:var(--tol-bg);color:var(--tol-fg)}
.chip.bad{background:var(--bad-bg);color:var(--bad-fg)}
.chip.wait{background:var(--wait-bg);color:var(--wait-fg)}
.banner{border-radius:12px;padding:12px 16px;font-weight:700}
.banner.warn{background:var(--tol-bg);color:var(--tol-fg)}
.banner.err{background:var(--bad-bg);color:var(--bad-fg)}
.banner.info{background:#E3EEFB;color:#123E70}
.banner.good{background:var(--ok-bg);color:var(--ok-fg)}
input[type=text],input[type=password],input[type=search],select{width:100%;min-height:52px;padding:0 14px;border:2px solid #B7C0CC;border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #2F7BD3;outline-offset:1px}
.qty{min-height:80px;font-size:44px;font-weight:700;border-width:3px;border-radius:16px}
label.l{display:block;font-weight:700;margin:10px 0 6px}
.split{display:flex;gap:18px;align-items:flex-start}
.split>.left{flex:0 0 440px;min-width:0}
.split>.right{flex:1;min-width:0}
@media (max-width:900px){.split{flex-direction:column}.split>.left{flex:1 1 auto;width:100%}}
.entry{display:flex;align-items:center;gap:10px;width:100%;min-height:76px;text-align:left;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin-bottom:10px}
.entry.sel{border-color:var(--lc,var(--navy))}
.entry .c{flex:1;min-width:0}
.entry .code{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.entry .nm{font-size:15px;color:var(--muted)}
.entry .r{text-align:right;white-space:nowrap}
.entry .r b{font-size:20px;display:block}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th{text-align:left;font-size:14px;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid #E1E6ED;vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2430;color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:30;max-width:90vw}
.toast.err{background:#8F1D12}
.stat{border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{font-size:15px;font-weight:700}
.stat.ok{background:var(--ok-bg);color:var(--ok-fg)}.stat.tol{background:var(--tol-bg);color:var(--tol-fg)}
.stat.bad{background:var(--bad-bg);color:var(--bad-fg)}.stat.wait{background:var(--wait-bg);color:var(--wait-fg)}
.kpi{background:#fff;border-radius:16px;padding:18px 20px}
.kpi .k{font-size:15px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:48px;font-weight:700;line-height:1.2}
.bar{height:14px;border-radius:7px;background:#E4E8EE;overflow:hidden}.bar>i{display:block;height:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700}
.tab.on{background:var(--navy);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;padding:22px 24px}
.cam{position:fixed;inset:0;background:#000;z-index:25;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.cam .bar2{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:#0b1624;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
@media print{
  .hdr .btn,.noprint,.toast{display:none!important}
  body{background:#fff}
  .card{border:1px solid #bbb}
}

.entry-wrap{position:relative}
.entry-wrap .entry{padding-right:36px}
.del-x{position:absolute;top:-8px;right:-8px;width:36px;height:36px;border-radius:50%;background:#C62828;color:#fff;border:3px solid #fff;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0}
.del-x:active{transform:scale(.92)}
.confirm-del{max-width:440px;margin-top:12vh}
.qbar{position:fixed;left:16px;bottom:16px;z-index:30;background:#17406F;color:#fff;padding:10px 16px;border-radius:12px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.qbar.err{background:#B4470B}
/* หน้านับ: ช่องยิง > รายละเอียด/ช่องจำนวน > รายการ (จอแคบเรียงบนลงล่าง จอกว้างแบ่งซ้ายขวา) */
.cgrid{display:grid;grid-template-columns:440px minmax(0,1fr);grid-template-areas:"scan panel" "list panel";gap:0 18px;align-items:start}
.a-scan{grid-area:scan;min-width:0}.a-panel{grid-area:panel;min-width:0;scroll-margin-top:8px}.a-list{grid-area:list;min-width:0}
@media (max-width:900px){.cgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"scan" "panel" "list"}.a-panel.empty{display:none}.a-panel{margin-bottom:14px}}
.entry{border-left-width:10px}
.entry.m-ok{border-color:#2E9E5B;background:#F3FBF6}
.entry.m-tol{border-color:#D9A400;background:#FFFBEB}
.entry.m-bad{border-color:#C62828;background:#FFF4F2}
.entry.m-wait,.entry.m-nosim{border-color:#9AA5B4}
.entry.sel{box-shadow:0 0 0 3px var(--lc,var(--navy))}
.entry .nums{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.entry .nums b{font-size:22px;line-height:1.1}
.entry .nums .sx{font-size:17px}
.entry .mut,.mut{font-size:14px;color:var(--muted)}
.entry .oth{font-size:14px;margin-top:4px;color:#3B4655}
.mbar{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.mtop b{font-size:28px;color:#14532D}
.mtrack{height:12px;background:#FDE0DC;border-radius:999px;overflow:hidden;margin:6px 0 8px}
.mfill{height:100%;background:#2E9E5B}
.mleg{display:flex;flex-wrap:wrap;gap:6px}
.entry .pair{display:flex;gap:18px}
.entry .pair>div{display:flex;flex-direction:column;align-items:flex-end}
.entry .pair .sx{font-size:22px;color:#3B4655}
/* หน้าหัวหน้างาน: 2 สถานะ + เลขลำดับ + ส่วนต่าง */
.entry.m-ok{border-color:#2E9E5B;background:#F3FBF6}
.entry.m-bad{border-color:#C62828;background:#FFF4F2}
.entry .seq{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;background:#17406F;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;align-self:flex-start;padding:0 6px}
.entry .nums{flex-direction:row;align-items:stretch;gap:10px;flex-wrap:nowrap}
.entry .nb{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:64px}
.entry .nb b{font-size:22px;line-height:1.15}
.entry .cnt,.mbar .cnt{color:#1F5FA6}
.entry .sx{color:#111}
.entry .dbox{border:2px solid #9AA5B4;border-radius:10px;padding:4px 10px;background:#fff;min-width:78px}
.entry .dbox.zero b{color:#111}.entry .dbox.pos b{color:#1E7B3C}.entry .dbox.neg b{color:#C62828}
.entry .dbox.pos{border-color:#2E9E5B}.entry .dbox.neg{border-color:#C62828}
.mbar{position:sticky;top:0;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.mbar .pct{font-size:28px;color:#14532D}.mbar .okc{color:#1E7B3C}.mbar .badc{color:#C62828}
@media (max-width:640px){.entry .nums{flex-wrap:wrap;justify-content:flex-end}.entry .nb{min-width:56px}}
.entry .nb .sx{font-size:22px}
/* หน้าเลือกไลน์: การ์ดขนาดเท่ากันทุกใบ + % ตรง */
.ltiles .tile{height:210px;min-height:0}
.tile .tstat{display:flex;flex-direction:column;gap:6px}
.tile .tpct b{font-size:30px;line-height:1}
.tile .tpct{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
/* % บอกชัดว่าเป็น % อะไร */
.pctw{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
/* กรอบผลต่าง: ไม่มีคำนำ ตัวเลขกลางกรอบ */
.entry .dbox{display:flex;align-items:center;justify-content:center;align-self:center;min-width:84px;min-height:56px;padding:4px 10px}
.entry .dbox b{font-size:24px}
/* หน้า ของที่มีในไลน์ทั้งหมด */
.alist{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border:3px solid var(--line);border-left-width:10px;border-radius:14px;background:#fff;color:var(--ink);min-height:70px}
.arow .an{min-width:40px;height:40px;border-radius:10px;background:#E4E8EE;color:#3B4655;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.arow .c{flex:1;min-width:0}.arow .code{font-weight:700;font-size:17px;overflow-wrap:anywhere}.arow .nm{font-size:15px;color:var(--muted)}
.arow .nb{display:flex;flex-direction:column;align-items:flex-end;min-width:76px}
.arow .nb b{font-size:22px}.arow .sx{color:#111}.arow .cnt{color:#1F5FA6}
.arow.done{border-color:#1F5FA6;background:#F2F7FD}
.arow.todo{border-color:#E07B00;background:#FFF6EA}
.arow.todo .code{color:#9A4F00}
.arow .todo-t{color:#C25E00;font-size:18px}
.arow .oth{font-size:14px;color:#3B4655;margin-top:2px}
.mbar .allc{color:#111}.mbar .todoc{color:#C25E00}
/* v3: จอกว้างให้รายการเต็มความกว้าง, การ์ดสูงเท่ากัน, คอลัมน์ตัวเลขตรงกัน */
.cgrid{grid-template-columns:minmax(0,440px) minmax(0,1fr);grid-template-areas:"scan panel" "list list"}
.a-list{margin-top:12px}
@media (min-width:901px){.a-panel.empty{align-self:start}}
.entry{min-height:92px;height:92px;align-items:center;gap:14px;padding:8px 14px;overflow:hidden}
.entry .c{flex:1;min-width:0;overflow:hidden}
.entry .code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.entry .code .chip{font-size:12px;padding:1px 8px;vertical-align:2px;margin-left:4px}
.entry .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oth1{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;margin-top:4px}
.ltag{flex:0 0 auto;font-size:12px;padding:1px 8px;border-radius:999px;background:#E4E8EE;color:#3B4655;white-space:nowrap}
.ltag.has{background:#E3EEFB;color:#1F5FA6;font-weight:700}
.entry .seq{align-self:center}
.ncol{flex:0 0 96px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15}
.ncol b{font-size:22px}.ncol .cnt{color:#1F5FA6}.ncol .sx{color:#111}
.ncol .tot{font-size:12px;color:var(--muted);white-space:nowrap}
.entry .dbox{flex:0 0 96px;width:96px;height:56px;min-height:0;align-self:center;margin-right:18px}
.arow{height:78px;min-height:0;overflow:hidden}
.arow .code,.arow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ncol{flex-basis:100px}
.mbar{z-index:6}
@media (max-width:640px){.ncol{flex-basis:70px}.ncol b{font-size:18px}.entry .dbox{flex-basis:70px;width:70px;margin-right:14px}.entry .seq{min-width:32px;height:32px;font-size:15px}}
.ptable{display:none}
@media print{
  .hdr,.mbar,.alist,#qbar{display:none!important}
  .ptable{display:block}
  .ptable h2{font-size:16px;margin:0 0 8px}
  .ptable table{width:100%;border-collapse:collapse;font-size:11px}
  .ptable th,.ptable td{border:1px solid #888;padding:4px 6px;text-align:left}
  .ptable th{background:#17406F;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ptable td.n,.ptable th.n{text-align:right}
  .ptable td:nth-child(6){min-width:70px}
  .ptable tr{break-inside:avoid}
  .wrap{max-width:none;padding:0}
  @page{size:A4;margin:10mm}
}
@media (max-width:640px){
  .entry{flex-wrap:wrap;height:140px;align-content:center;row-gap:6px}
  .entry .c{flex:1 1 calc(100% - 60px)}
  .entry .ncol{flex:1 1 0;align-items:flex-start}
  .entry .ncol:first-of-type{margin-left:46px}
  .entry .dbox{margin-right:4px}
  .arow{flex-wrap:wrap;height:120px;align-content:center;row-gap:4px}
  .arow .c{flex:1 1 calc(100% - 56px)}
  .arow .ncol{flex:1 1 0;align-items:flex-start;margin-left:0}
}

/* v4: ช่องค้นหา/เรียง/กรองรายการในหน้านับ */
.lbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.lbar #lsearch{flex:1 1 220px;min-height:48px}
.lbar #sortby{flex:0 1 260px;min-height:48px;font-size:16px}
.fbtns{display:flex;flex-wrap:wrap;gap:8px}
#shown{font-size:15px}

/* v5: รายการแนะนำรหัส (ขึ้นใต้ช่อง ไม่บังช่อง) */
.sugwrap{position:relative;flex:1;min-width:0}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#fff;border:2px solid #2F7BD3;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.18);max-height:min(52vh,420px);overflow:auto;padding:4px}
.sug[hidden]{display:none}
.sugi{display:flex;gap:12px;align-items:baseline;justify-content:space-between;width:100%;min-height:46px;padding:8px 12px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--ink)}
.sugi b{font-size:17px;white-space:nowrap}
.sugi span{font-size:14px;color:#5B6675;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugi:hover,.sugi.on{background:#E6F0FB}
/* ใบพิมพ์รายการไม่ตรง */
@media print{
  body.print-bad .cgrid,body.print-bad .banner{display:none!important}
  body:not(.print-bad) .pbad{display:none!important}
  .pbad .psum{display:flex;gap:18px;font-size:13px;margin:0 0 4px}
  .pbad .psum .okc{color:#1E7B3C}.pbad .psum .badc{color:#C62828}
  .pbad .pnote{font-size:10px;color:#555;margin:0 0 6px}
  .pbad table{font-size:10.5px}
  .pbad td.d.pos{color:#1E7B3C}.pbad td.d.neg{color:#C62828}
  .pbad th.blank{min-width:55px}.pbad th.why{min-width:120px}
  .pbad td:nth-child(6){min-width:0}
  .pbad td{height:26px;vertical-align:middle}
  .pbad small{color:#555}
  .pbad .pfoot{margin-top:14px;font-size:12px}
}
/* v6: ใบไม่ตรง ทุกแถวบรรทัดเดียว สูงเท่ากัน */
@media print{
  .pbad table.tbad{table-layout:fixed;width:100%}
  .pbad .tbad th,.pbad .tbad td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:24px;padding:3px 5px;line-height:16px}
  .pbad .tbad td:nth-child(6){min-width:0}
}
/* v7: หัวใบไม่ตรง ไลน์ + % ใหญ่ · กระดาษแนวนอน */
@page land{size:A4 landscape;margin:8mm}
@media print{
  .pbad{page:land}
  .pbad .phead{display:flex;align-items:center;gap:18px;border:3px solid var(--lc);border-left-width:14px;border-radius:8px;padding:8px 14px;margin:0 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pbad .phead .pl{flex:1}
  .pbad .phead .pt{font-size:12px;color:#444}
  .pbad .phead .pline{font-size:30px;font-weight:800;line-height:1.1;color:var(--lc)}
  .pbad .phead .psub{font-size:12px;color:#555}
  .pbad .phead .pc{display:flex;gap:14px;font-size:15px}
  .pbad .phead .pc .okc{color:#1E7B3C}.pbad .phead .pc .badc{color:#C62828}
  .pbad .phead .pr{text-align:center;background:#14532D;color:#fff;border-radius:8px;padding:4px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pbad .phead .ppct{font-size:34px;font-weight:800;line-height:1.1}
  .pbad .phead .ppl{font-size:11px}
  .pbad .tbad td.oth{font-size:9.5px}
  .pbad .tbad td.oth .mut{color:#999}
}
/* v8: PC พิมพ์ใบไม่ตรงทุกไลน์ */
#pall{display:none}
@media print{
  body.print-all #app,body.print-all .toast{display:none!important}
  body.print-all #pall{display:block}
  #pall .psheet{display:block;break-after:page;page-break-after:always}

<script>
/* ตัวอ่านไฟล์ Excel (STOCK PD2 และ BOM) ฟังก์ชันล้วน ไม่แตะ DOM ทดสอบได้ใน Node */
(function (root) {
  'use strict';
  var norm = function (s) { return String(s === null || s === undefined ? '' : s).trim().toLowerCase(); };

  // names = รายชื่อชีต, rowsOf(name) = แถวของชีตเป็น array ของ array (เริ่มคอลัมน์ A)
  function parseStock(names, rowsOf) {
    var order = names.slice().sort(function (a, b) { return (norm(b) === 'stock pd2') - (norm(a) === 'stock pd2'); });
    for (var n = 0; n < order.length; n++) {
      var rows = rowsOf(order[n]);
      for (var r = 0; r < Math.min(rows.length, 10); r++) {
        var hdr = rows[r].map(norm);
        var iItem = hdr.indexOf('item'), iQty = hdr.indexOf('actual stock');
        if (iItem < 0 || iQty < 0) continue;
        var iName = hdr.indexOf('item name');
        var map = {}, list = [];
        for (var i = r + 1; i < rows.length; i++) {
          var a = rows[i];
          var code = a[iItem] === null || a[iItem] === undefined ? '' : String(a[iItem]).trim();
          if (!code) continue;
          var qty = Number(a[iQty]);
          if (a[iQty] === null || a[iQty] === undefined || a[iQty] === '' || !isFinite(qty)) continue;
          var k = code.toUpperCase();
          if (map[k] !== undefined) list[map[k]].qty += qty;
          else { map[k] = list.length; list.push({ code: code, name: iName >= 0 && a[iName] != null ? String(a[iName]).trim() : '', qty: qty }); }
        }
        return { sheet: order[n], items: list };
      }
    }
    throw new Error('ไม่พบหัวคอลัมน์ "Item" และ "Actual Stock" ในไฟล์ (ต้องเป็นไฟล์ STOCK PD2 จาก SimLex)');
  }

  var LINE_SHEETS = { CNC: 'CNC', FRI: 'FRI', HWD: 'HWD', ASS: 'ASS', RWD: 'RWD' };

  // หาแถวข้อมูลด้วยรูปแบบ: [กลุ่ม] เลขที่(NO.) รหัส Item | ชื่อ | Model | Process
  function parseBom(names, rowsOf) {
    var lines = {}, found = [];
    names.forEach(function (name) {
      var key = LINE_SHEETS[String(name).trim().toUpperCase()];
      if (!key) return;
      found.push(String(name).trim());
      var seen = {}, list = [];
      rowsOf(name).forEach(function (a) {
        for (var i = 0; i < a.length - 4; i++) {
          if (typeof a[i] === 'number' && typeof a[i + 1] === 'string' && a[i + 1].trim() &&
              typeof a[i + 2] === 'string' && typeof a[i + 3] === 'string') {
            var code = a[i + 1].trim(), k = code.toUpperCase();
            if (!seen[k]) {
              seen[k] = true;
              list.push({ code: code, name: String(a[i + 2]).trim(), model: String(a[i + 3]).trim(),
                process: a[i + 4] == null ? '' : String(a[i + 4]).trim(),
                grp: i > 0 && a[i - 1] != null ? String(a[i - 1]).trim() : '' });
            }
            break;
          }
        }
      });
      lines[key] = list;
    });
    if (!found.length) throw new Error('ไม่พบชีตรายไลน์ (CNC, FRI, HWD, ASS, RWD) ในไฟล์ BOM');
    return { sheets: found, lines: lines };
  }

  var api = { parseStock: parseStock, parseBom: parseBom };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Parse = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* ส่วนที่ใช้ร่วมกันของหน้าหัวหน้างานและหน้า PC: เรียก Apps Script, รหัสเข้าใช้งาน, อ่านไฟล์ Excel, ดาวน์โหลดไฟล์ */
const H = (() => {
  const base = typeof window.__BASE__ === 'string' ? window.__BASE__ : '';
  let memCode = '', memAdmin = '';
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (_) {} return ''; };
  const getCode = () => memCode || store('appCode');
  const getAdmin = () => memAdmin || (() => { try { return sessionStorage.getItem('adminCode') || ''; } catch (_) { return ''; } })();
  const setCode = (c) => { memCode = c; store('appCode', c); };
  const setAdmin = (c) => { memAdmin = c; try { sessionStorage.setItem('adminCode', c); } catch (_) {} };

  function rawCall(path, opt) {
    return new Promise((resolve, reject) => {
      const parts = path.split('?');
      const query = {};
      if (parts[1]) {
        parts[1].split('&').forEach((kv) => {
          if (!kv) return;
          const i = kv.indexOf('=');
          const k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
          query[k] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
        });
      }
      let body = null;
      if (opt.body) { try { body = JSON.parse(opt.body); } catch (_) { body = null; } }
      if (window.APP_CONFIG && window.APP_CONFIG.api) {
        const payload = { method: String(opt.method || 'GET').toUpperCase(), path: parts[0], query, body, code: getCode(), adminCode: getAdmin() };
        // text/plain ทำให้เบราว์เซอร์ไม่ต้องส่ง preflight (Apps Script ไม่รองรับ OPTIONS)
        fetch(window.APP_CONFIG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
          .then((r) => r.json()).then(resolve)
          .catch(() => reject(new Error('เชื่อมต่อระบบไม่ได้ (เช็คเน็ต หรือลิงก์ Apps Script ใน config.js)')));
        return;
      }
      if (!window.google || !google.script || !google.script.run) { reject(new Error('หน้านี้ต้องเปิดจากลิงก์ของแอป (Web app) ไม่ใช่เปิดไฟล์ตรงๆ')); return; }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e))))
        .apiCall({ method: String(opt.method || 'GET').toUpperCase(), path: parts[0], query, body, code: getCode(), adminCode: getAdmin() });
    });
  }

  let askPromise = null;
  function askCode() {
    if (askPromise) return askPromise;
    askPromise = new Promise((resolve) => {
      const ov = document.createElement('div');
      ov.className = 'modal-bg';
      ov.innerHTML = '<form class="modal" style="max-width:460px"><h1 style="font-size:24px">ใส่รหัสเข้าใช้งานของบริษัท</h1>' +
        '<p class="muted">เป็นรหัสกลาง ใส่ครั้งเดียวต่อแท็บเล็ต ไม่ใช่รหัสส่วนตัว</p>' +
        '<input id="ac" type="password" autocomplete="off" aria-label="รหัสเข้าใช้งาน">' +
        '<div id="acm" class="banner err" style="display:none;margin-top:10px"></div>' +
        '<button class="btn big" style="width:100%;margin-top:14px" type="submit">เข้าใช้งาน</button></form>';
      document.body.appendChild(ov);
      const inp = ov.querySelector('#ac');
      inp.focus();
      ov.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = inp.value;
        let r;
        try { r = await rawCall('/api/login', { method: 'POST', body: JSON.stringify({ code }) }); } catch (_) { r = { status: 0, data: { message: 'เชื่อมต่อไม่ได้ ลองอีกครั้ง' } }; }
        if (r.status === 200) { setCode(code); ov.remove(); askPromise = null; resolve(); }
        else { const m = ov.querySelector('#acm'); m.textContent = r.data.message || 'รหัสไม่ถูกต้อง'; m.style.display = 'block'; inp.select(); }
      });
    });
    return askPromise;
  }

  // กล่องถาม/ยืนยันในหน้าเว็บ (แทน prompt()/confirm() ที่บางเบราว์เซอร์/แอปไม่รองรับ)
  const escH = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function dialog({ title, msg, input, okText, danger }) {
    return new Promise((resolve) => {
      const ov = document.createElement('div');
      ov.className = 'modal-bg';
      ov.innerHTML = '<form class="modal" style="max-width:480px" role="dialog" aria-modal="true">' +
        '<h1 style="font-size:22px;margin:0 0 8px">' + escH(title) + '</h1>' +
        (msg ? '<p style="font-size:17px;margin:0 0 12px">' + escH(msg) + '</p>' : '') +
        (input ? '<input id="dlg-in" type="' + (input === 'password' ? 'password' : 'text') + '" autocomplete="off" aria-label="' + escH(title) + '">' : '') +
        '<div class="row" style="gap:12px;margin-top:16px"><button type="button" class="btn sec big" style="flex:1" data-x="no">ยกเลิก</button>' +
        '<button type="submit" class="btn big" style="flex:1' + (danger ? ';background:#C62828' : '') + '">' + escH(okText || 'ตกลง') + '</button></div></form>';
      document.body.appendChild(ov);
      const inp = ov.querySelector('#dlg-in');
      const done = (v) => { ov.remove(); resolve(v); };
      ov.querySelector('[data-x=no]').addEventListener('click', () => done(input ? null : false));
      ov.addEventListener('click', (e) => { if (e.target === ov) done(input ? null : false); });
      ov.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); done(input ? inp.value : true); });
      ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') done(input ? null : false); });
      (inp || ov.querySelector('[type=submit]')).focus();
    });
  }
  const confirmBox = (msg, okText, danger) => dialog({ title: 'ยืนยัน', msg, okText: okText || 'ยืนยัน', danger });

  async function api(path, opt = {}) {
    let res = await rawCall(path, opt);
    if (res.status === 401 && path !== '/api/login') { await askCode(); res = await rawCall(path, opt); }
    else if (res.status === 403 && res.data && res.data.error === 'admin') {
      const c = await dialog({ title: 'ใส่รหัสผู้ดูแล (PC)', msg: 'งานนี้ต้องใช้รหัสผู้ดูแล', input: 'password', okText: 'ตกลง' });
      if (c) { setAdmin(c); res = await rawCall(path, opt); }
    }
    if (res.status >= 400) {
      const e = new Error((res.data && (res.data.message || res.data.error)) || 'เกิดข้อผิดพลาด');
      e.data = res.data; e.status = res.status; throw e;
    }
    return res.data;
  }

  // อ่านไฟล์ .xlsx ในเบราว์เซอร์ด้วย SheetJS (โหลดจาก CDN เมื่อใช้งานครั้งแรก)
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ (เครือข่ายอาจบล็อก cdnjs.cloudflare.com) ลองต่อเน็ตอื่น หรือแจ้งผู้พัฒนา'));
      document.head.appendChild(s);
    });
  }
  async function readWorkbook(file) {
    await loadXlsx();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    return {
      names: wb.SheetNames,
      rowsOf: (n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true })
    };
  }

  function download(b64, filename) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  return { base, api, readWorkbook, download, xlsx: loadXlsx, confirm: confirmBox, dialog };
})();

</script>
<script>
/* หน้าจอหัวหน้างาน (แท็บเล็ต) - พอร์ตจาก public/app.js */
/* หน้าจอหัวหน้างาน (แท็บเล็ต): เลือกไลน์ > ยิง QR/พิมพ์ Item > ใส่ยอด > สรุป/ส่งยอด */
function startApp() {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => (n === null || n === undefined ? '-' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 3 }));
  const fmtDiff = (n) => (n === null || n === undefined ? '-' : (n > 0 ? '+' : '') + fmt(n));
  const ST = {
    ok: ['ตรง', 'ok'], tol: ['ต่างเล็กน้อย', 'tol'], bad: ['ไม่ตรง', 'bad'],
    wait: ['รอไลน์อื่น', 'wait'], nosim: ['ไม่มีใน SimLex', 'wait']
  };
  const chip = (s) => `<span class="chip ${(ST[s] || ST.wait)[1]}">${(ST[s] || ST.wait)[0]}</span>`;
  const thTime = (iso) => (iso ? new Date(iso).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', dateStyle: 'short', timeStyle: 'short' }) : '');

  const S = {
    meta: null, view: 'home', line: null, lineData: null, summary: null,
    item: null, qty: '', toast: null, kbd: false, busy: false,
    who: '', sort: 'new', fil: 'all', q: ''
  };
  try { S.who = localStorage.getItem('who') || ''; } catch (_) {}

  const api = H.api;
  let toastTimer;
  function toast(msg, err) {
    S.toast = { msg, err };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; paintToast(); }, 3200);
    paintToast();
  }
  function paintToast() {
    let el = $('#toast');
    if (!S.toast) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'toast' + (S.toast.err ? ' err' : '');
    el.textContent = S.toast.msg;
  }

  // ---------- routing (เก็บในหน่วยความจำ เพราะหน้าเว็บอยู่ใน iframe ของ Apps Script) ----------
  let R = { view: 'home', line: null };
  function nav(view, line) { R = { view, line: line || null }; route(); }
  async function route() {
    const r = R;
    S.view = r.view; S.line = r.line; S.item = null; S.qty = '';
    try {
      if (r.view === 'count') {
        if (!S.meta) render();
        const full = await api('/api/line/' + encodeURIComponent(r.line) + '?full=1');
        S.meta = full.meta; S.lineData = full; buildIndex(full.master);
        applyPendingToLine();
      } else if (r.view === 'lines') {
        const full = await api('/api/line/' + encodeURIComponent((S.meta && S.meta.lines[0] && S.meta.lines[0].id) || 'CNC') + '?full=1');
        S.meta = full.meta; buildIndex(full.master);
      } else if (r.view === 'lineall') {
        if (!M || !S.meta) { const full = await api('/api/line/' + encodeURIComponent(r.line) + '?full=1'); S.meta = full.meta; S.lineData = full; buildIndex(full.master); }
      } else {
        S.meta = await api('/api/meta');
        if (r.view === 'summary') { await flushQueue(); S.summary = await api('/api/line/' + encodeURIComponent(r.line) + '/summary'); }
      }
    } catch (e) {
      toast(e.message, true);
      if (!S.meta) {
        $('#app').innerHTML = '<div class="wrap"><div class="banner err">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + ' <button class="btn sec sm" data-act="retry">ลองใหม่</button></div></div>';
        return;
      }
      if (r.view === 'count' || r.view === 'summary') { R = { view: 'lines', line: null }; S.view = 'lines'; S.line = null; }
    }
    render();
  }


  // ---------- ข้อมูลหลักในแท็บเล็ต: ค้นหา Item ทันทีไม่ต้องรอเซิร์ฟเวอร์ ----------
  let M = null;
  function buildIndex(m) {
    if (!m) { M = null; return; }
    const info = {}, cand = {}, stock = {}, counts = {};
    m.items.forEach((r) => { info[r[0].toUpperCase()] = { code: r[0], name: r[1], model: r[2], process: r[3] }; });
    m.cand.forEach((r) => { const k = r[1].toUpperCase(); (cand[k] = cand[k] || {})[r[0]] = true; });
    m.stock.forEach((r) => { stock[r[0].toUpperCase()] = { code: r[0], name: r[1], qty: Number(r[2]) }; });
    const order = {};
    m.counts.forEach((r) => { const k = r[1].toUpperCase(); (counts[k] = counts[k] || {})[r[0]] = Number(r[2]); (order[r[0]] = order[r[0]] || []).push(k); });
    M = { info, cand, stock, counts, order, submitted: m.submitted || {}, tol: Number(m.tolerance) || 0, lineIds: m.lineIds || [] };
  }
  const r3 = (x) => Math.round(x * 1000) / 1000;
  const lname = (id) => lineOf(id).name;
  // กติกาเดียวกับ analyzeData_ ใน Code.gs (คำนวณเฉพาะ Item เดียว)
  function rowOf(code) {
    const k = String(code).toUpperCase();
    const it = M.info[k], st = M.stock[k], per = M.counts[k] || {};
    const counted = Object.keys(per);
    let total = 0; counted.forEach((l) => { total += per[l]; });
    const set = {}; Object.keys(M.cand[k] || {}).forEach((l) => { set[l] = true; }); counted.forEach((l) => { set[l] = true; });
    let candLines = Object.keys(set); if (!candLines.length) candLines = M.lineIds.slice();
    const pending = candLines.filter((l) => !M.submitted[l]);
    const simlex = st ? st.qty : null;
    const diff = simlex === null ? null : r3(total - simlex);
    let status;
    if (simlex === null) status = 'nosim';
    else if (pending.length) status = 'wait';
    else if (diff === 0) status = 'ok';
    else if (Math.abs(diff) <= M.tol) status = 'tol';
    else status = 'bad';
    return { code: (st && st.code) || (it && it.code) || code, name: (it && it.name) || (st && st.name) || '', model: it ? it.model : '', process: it ? it.process : '',
      simlex, total: r3(total), diff, status, perLine: per, candLines, known: !!(it || st), inBom: !!it, inStock: !!st, candBom: M.cand[k] || {} };
  }
  function localLookup(raw) {
    const r = rowOf(raw);
    const line = S.line;
    const set = Object.assign({}, r.candBom); Object.keys(r.perLine).forEach((l) => { set[l] = true; });
    const others = Object.keys(set).filter((l) => l !== line).map((l) => ({ line: l, name: lname(l), qty: r.perLine[l] !== undefined ? r.perLine[l] : null, submitted: !!M.submitted[l] }));
    return { code: r.code, known: r.known, inBom: r.inBom, inStock: r.inStock, name: r.name, model: r.model, process: r.process,
      simlex: r.simlex, mine: r.perLine[line] !== undefined ? r.perLine[line] : null, belongsToLine: !!r.candBom[line], others };
  }
  function localEntry(code, qty) {
    const r = rowOf(code), line = S.line;
    return { code: r.code, qty, counted_by: S.who, updated_at: new Date().toISOString(), name: r.name, model: r.model, process: r.process,
      simlex: r.simlex, total: r.total, diff: r.diff, status: r.status,
      others: r.candLines.filter((l) => l !== line).map((l) => ({ line: l, name: lname(l), qty: r.perLine[l] !== undefined ? r.perLine[l] : null, submitted: !!M.submitted[l] })) };
  }
  function totalOf(k) { const per = (M && M.counts[k]) || {}; let t = 0; Object.keys(per).forEach((l) => { t += per[l]; }); return r3(t); }
  function lineStats(line) {
    if (!M) return null;
    let n = 0, ok = 0;
    Object.keys(M.counts).forEach((k) => {
      if (M.counts[k][line] === undefined) return;
      n++;
      const sx = M.stock[k] ? M.stock[k].qty : 0;
      if (r3(totalOf(k) - sx) === 0) ok++;
    });
    return { n, ok, bad: n - ok, pct: n ? Math.round(ok * 1000 / n) / 10 : null };
  }
  // รายการของทั้งไลน์: Item ใน BOM ของไลน์นี้ที่ยอด SimLex ไม่เป็น 0 (ติดลบแสดง) + ที่ไลน์นี้นับไว้แล้ว
  function lineAll(line) {
    const keys = {};
    Object.keys(M.cand).forEach((k) => { if (M.cand[k][line] && M.stock[k] && M.stock[k].qty !== 0) keys[k] = true; });
    Object.keys(M.counts).forEach((k) => { if (M.counts[k][line] !== undefined) keys[k] = true; });
    return Object.keys(keys).map((k) => {
      const it = M.info[k], st = M.stock[k], per = M.counts[k] || {};
      const mine = per[line] !== undefined ? per[line] : null;
      const others = Object.keys(Object.assign({}, M.cand[k] || {}, per)).filter((l) => l !== line)
        .map((l) => ({ name: lname(l), qty: per[l] !== undefined ? per[l] : null }));
      return { code: (it && it.code) || (st && st.code) || k, name: (it && it.name) || (st && st.name) || '', model: it ? it.model : '', process: it ? it.process : '',
        simlex: st ? st.qty : null, mine, done: mine !== null, others };
    }).sort((a, b) => (a.done - b.done) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));
  }
  // เลขลำดับ = ลำดับที่นับ (ตัวแรกที่นับ = 1) ใช้เรียกรายการ
  function seqOf(code) {
    if (!M) return null;
    const o = M.order[S.line] || [];
    const i = o.indexOf(String(code).toUpperCase());
    return i < 0 ? null : i + 1;
  }
  function putEntry(e) {
    if (M) { const o = (M.order[S.line] = M.order[S.line] || []); const k = e.code.toUpperCase(); if (o.indexOf(k) < 0) o.push(k); }
    const list = S.lineData.entries.filter((x) => x.code.toUpperCase() !== e.code.toUpperCase());
    list.unshift(e); S.lineData.entries = list;
  }

  // ---------- คิวส่งยอดเบื้องหลัง: กดบันทึกแล้วยิงตัวต่อไปได้เลย ระบบส่งขึ้นชีตเองทีละรายการ ----------
  const QKEY = 'wipQueue';
  let Q = [];
  try { Q = JSON.parse(localStorage.getItem(QKEY) || '[]') || []; } catch (_) { Q = []; }
  let qRunning = false, qFail = 0, qWaiters = [];
  const qSave = () => { try { localStorage.setItem(QKEY, JSON.stringify(Q)); } catch (_) {} };
  function paintQueue() {
    let el = $('#qbar');
    if (!Q.length) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'qbar'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'qbar' + (qFail ? ' err' : '');
    el.textContent = qFail ? 'ส่งไม่สำเร็จ ' + Q.length + ' รายการ กำลังลองใหม่อัตโนมัติ (เช็คเน็ต)' : 'กำลังส่งขึ้นระบบ ' + Q.length + ' รายการ...';
  }
  function enqueue(job) {
    // รายการเดียวกันที่ยังไม่ได้ส่ง ให้ใช้ยอดล่าสุดแทน (ส่งเป็นยอดสุดท้ายเสมอ ส่งซ้ำได้ไม่ผิด)
    Q = Q.filter((j, i) => !(i > 0 && j.line === job.line && j.code.toUpperCase() === job.code.toUpperCase()));
    Q.push(job); qSave(); paintQueue(); runQueue();
  }
  async function runQueue() {
    if (qRunning) return;
    qRunning = true;
    while (Q.length) {
      const job = Q[0];
      try {
        const r = await api('/api/count', { method: 'POST', body: JSON.stringify({ line: job.line, code: job.code, qty: job.qty, mode: 'set', name: job.name }) });
        Q.shift(); qSave(); qFail = 0;
        if (S.view === 'count' && S.line === job.line && S.lineData && r.entry && !Q.some((j) => j.line === job.line && j.code.toUpperCase() === job.code.toUpperCase())) {
          const cur = S.lineData.entries.find((x) => x.code.toUpperCase() === r.entry.code.toUpperCase());
          if (cur) { putEntry(Object.assign({}, r.entry)); keepFocusRender(); }
        }
      } catch (e) {
        const st = e.status || 0;
        if (st === 409 || st === 400 || st === 404) {
          Q.shift(); qSave();
          toast('บันทึก ' + job.code + ' ไม่สำเร็จ: ' + e.message, true);
          if (S.view === 'count' && S.line === job.line) route();
        } else {
          qFail++; paintQueue();
          await new Promise((ok) => setTimeout(ok, Math.min(30000, 3000 * qFail)));
        }
      }
      paintQueue();
    }
    qRunning = false; paintQueue();
    const w = qWaiters; qWaiters = []; w.forEach((f) => f());
  }
  function flushQueue() {
    if (!Q.length) return Promise.resolve();
    toast('รอส่งยอดที่ค้างอยู่ให้ครบก่อน...', false);
    runQueue();
    return new Promise((ok) => qWaiters.push(ok));
  }
  // ถ้าเปิดหน้าไลน์ใหม่ระหว่างยังส่งไม่หมด ให้เห็นยอดที่รอส่งอยู่ด้วย
  function applyPendingToLine() {
    if (!M) return;
    Q.filter((j) => j.line === S.line).forEach((j) => {
      const k = j.code.toUpperCase(); (M.counts[k] = M.counts[k] || {})[j.line] = j.qty;
      putEntry(localEntry(j.code, j.qty));
    });
  }
  function keepFocusRender() {

  window.addEventListener('online', () => { qFail = 0; runQueue(); });
  setTimeout(runQueue, 1500);

  const lineOf = (id) => (S.meta && S.meta.lines.find((l) => l.id === id)) || { id, name: id, color: '#17406F' };

  // หน้าหัวหน้างาน: เทียบแค่ 2 สถานะ ตรง (ส่วนต่าง = 0) / ไม่ตรง (ไม่ใช้ค่าเผื่อ ±1 ที่หน้านี้)
  function cmpOf(e) {
    const sx = e.simlex === null || e.simlex === undefined ? 0 : Number(e.simlex);
    const d = r3(Number(e.total) - sx);
    const waitL = (e.others || []).filter((o) => o.qty === null && !o.submitted).map((o) => o.name);
    return { k: d === 0 ? 'ok' : 'bad', t: d === 0 ? 'ตรง' : 'ไม่ตรง', d, sx, nosim: e.simlex === null || e.simlex === undefined, waitL };
  }
  const diffCls = (d) => (d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero');
  const SORTS = { new: 'ล่าสุดไว้บน', seq: 'เลขลำดับ 1, 2, 3...', qty: 'นับได้ (มาก→น้อย)', sx: 'SimLex (มาก→น้อย)', diff: 'ส่วนต่าง (มาก→น้อย)' };
  // ตัวเลือกสำหรับช่องพิมพ์รหัส: เฉพาะ Item ที่อยู่ในไลน์นี้ (จาก BOM + ที่นับไว้แล้ว) ใช้เป็นตัวช่วยพิมพ์
  // ตัวช่วยพิมพ์รหัส: เฉพาะ Item ในไลน์นี้ (BOM + ที่นับไว้แล้ว) ขึ้นใต้ช่องเมื่อพิมพ์ตั้งแต่ 2 ตัว
  let SUG = { line: null, list: [], shown: [], idx: -1 };
  function sugList() {
    if (!M) return [];
    if (SUG.line === S.line && SUG.n === Object.keys(M.counts).length) return SUG.list;
    const L = S.line, keys = {};
    Object.keys(M.cand).forEach((k) => { if (M.cand[k][L]) keys[k] = true; });
    Object.keys(M.counts).forEach((k) => { if (M.counts[k][L] !== undefined) keys[k] = true; });
    SUG.list = Object.keys(keys).map((k) => { const it = M.info[k], st = M.stock[k]; return { code: (it && it.code) || (st && st.code) || k, name: (it && it.name) || (st && st.name) || '' }; });
    SUG.line = S.line; SUG.n = Object.keys(M.counts).length;
    return SUG.list;
  }
  function hideSug() { const b = $('#sug'); if (b) { b.hidden = true; b.innerHTML = ''; } SUG.shown = []; SUG.idx = -1; }
  function paintSug(v) {

    const rest = all.filter((x) => !x.code.toUpperCase().startsWith(q) && (x.code.toUpperCase().includes(q) || x.name.toUpperCase().includes(q)));

  function listRows() {

    else if (S.fil === 'ok') rows = rows.filter((r) => r.c.k === 'ok');

    if (q && /^\d+$/.test(q) && rows.some((r) => r.seq === Number(q))) rows = rows.filter((r) => r.seq === Number(q));
    else if (q) rows = rows.filter((r) => String(r.e.code).toUpperCase().includes(q) || String(r.e.name || '').toUpperCase().includes(q));

  // ใบงานพิมพ์: เฉพาะรายการไม่ตรง เรียงส่วนต่างมากไปน้อย เอาไปนับใหม่/หาสาเหตุ
  function badSheet() {

    return `<div class="phead" style="--lc:${L.color}">
        <div class="pl"><div class="pt">ใบตรวจรายการไม่ตรง SimLex · รอบ ${esc((S.meta && S.meta.round && S.meta.round.label) || '')}</div><div class="pline">ไลน์ ${esc(L.name)}</div><div class="psub">${esc(L.sub || '')}</div></div>

      <table class="tbad"><colgroup><col style="width:3%"><col style="width:4.5%"><col style="width:15%"><col style="width:15%"><col style="width:9%"><col style="width:6.5%"><col style="width:11%"><col style="width:6.5%"><col style="width:6.5%"><col style="width:6.5%"><col style="width:7%"><col style="width:9.5%"></colgroup>

  function loadStyleXlsx() {
    if (window.__XLSX_STYLE__) return Promise.resolve();

      sc.onload = () => { window.__XLSX_STYLE__ = true; ok(); };
      sc.onerror = () => bad(new Error('โหลดตัวสร้าง Excel ไม่ได้ (เช็คเน็ต)'));
      document.head.appendChild(sc);

  async function exportLineAll() {
    try {
      await loadStyleXlsx();
      const L = lineOf(S.line), all = lineAll(S.line);
      const f = S.allFilter || 'all';
      const list = all.filter((x) => f === 'all' || (f === 'todo' ? !x.done : x.done));
      const round = (S.meta && S.meta.round && S.meta.round.label) || '';
      const r3n = (v) => (v === null || v === undefined ? '' : Math.round(Number(v) * 1000) / 1000);
      const head = ['ลำดับ', 'Item', 'ชื่อ', 'Model', 'Process', 'ยอด SimLex', 'นับได้', 'ผลต่าง', 'สถานะ', 'จดยอดนับ', 'ไลน์อื่นที่มี'];
      const aoa = [['ของที่มีในไลน์ ' + L.name + '  ·  รอบ ' + round], ['ทั้งหมด ' + list.length + ' รายการ  ·  นับแล้ว ' + list.filter((x) => x.done).length + '  ·  ยังไม่นับ ' + list.filter((x) => !x.done).length + '  ·  สร้างเมื่อ ' + new Date().toLocaleString('th-TH')], [], head];
      list.forEach((x, i) => aoa.push([i + 1, x.code, x.name, x.model, x.process, r3n(x.simlex), x.done ? r3n(x.mine) : '', x.done && x.simlex !== null ? r3n(x.mine - x.simlex) : '', x.done ? 'นับแล้ว' : 'ยังไม่นับ', '', x.others.map((o) => o.name).join(', ')]));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const thin = { style: 'thin', color: { rgb: 'B8C2CF' } };
      const box = { top: thin, bottom: thin, left: thin, right: thin };
      const font = { name: 'Tahoma', sz: 11 };
      const HR = 3;
      for (let r = 0; r < aoa.length; r++) for (let c = 0; c < head.length; c++) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (!ws[ref]) { if (r < HR) continue; ws[ref] = { t: 's', v: '' }; }
        const cell = ws[ref];
        if (r === 0) { cell.s = { font: { name: 'Tahoma', sz: 16, bold: true, color: { rgb: '17406F' } } }; continue; }
        if (r === 1) { cell.s = { font: { name: 'Tahoma', sz: 11, color: { rgb: '4A5565' } } }; continue; }
        if (r === HR) { cell.s = { font: { name: 'Tahoma', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '17406F' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: box }; continue; }
        const x = list[r - HR - 1];
        const zebra = (r - HR) % 2 === 0 ? 'F4F6F9' : 'FFFFFF';
        const st = { font, border: box, fill: { fgColor: { rgb: zebra } }, alignment: { vertical: 'center' } };
        if (c === 0) st.alignment.horizontal = 'center';
        if (c === 1) st.font = Object.assign({}, font, { bold: true });
        if (c >= 5 && c <= 7) { st.numFmt = '#,##0.###;[Red]-#,##0.###;0'; st.alignment.horizontal = 'right'; }
        if (c === 6 && x.done) st.font = Object.assign({}, font, { bold: true, color: { rgb: '1F5FA6' } });
        if (c === 7 && cell.v !== '') st.font = Object.assign({}, font, { bold: true, color: { rgb: cell.v > 0 ? '1E7B3C' : cell.v < 0 ? 'C62828' : '111111' } });
        if (c === 8) { st.alignment.horizontal = 'center'; st.font = Object.assign({}, font, { bold: true, color: { rgb: x.done ? '1F5FA6' : 'C25E00' } }); st.fill = { fgColor: { rgb: x.done ? 'E3EEFB' : 'FFEBD3' } }; }
        if (c === 9) st.fill = { fgColor: { rgb: 'FFFFFF' } };
        if (c === 10) st.font = Object.assign({}, font, { sz: 10, color: { rgb: '4A5565' } });
        cell.s = st;
      }
      ws['!cols'] = [{ wch: 7 }, { wch: 24 }, { wch: 32 }, { wch: 10 }, { wch: 14 }, { wch: 12 }, { wch: 11 }, { wch: 10 }, { wch: 11 }, { wch: 13 }, { wch: 24 }];
      ws['!rows'] = [{ hpt: 26 }, { hpt: 18 }, { hpt: 6 }, { hpt: 24 }];
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 10 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 10 } }];
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: HR, c: 0 }, e: { r: aoa.length - 1, c: head.length - 1 } }) };
      ws['!freeze'] = { xSplit: 0, ySplit: HR + 1 };
      ws['!views'] = [{ state: 'frozen', ySplit: HR + 1, topLeftCell: 'A' + (HR + 2) }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'ของในไลน์ ' + L.id);
      XLSX.writeFile(wb, 'ของในไลน์_' + L.name + '_' + round + '.xlsx');
      toast('ดาวน์โหลดไฟล์ Excel แล้ว', false);
    } catch (e) { toast('สร้างไฟล์ Excel ไม่สำเร็จ: ' + e.message, true); }
  }

          <td><b>${esc(e.code)}</b><br><span class="muted" style="font-size:14px">${esc(e.name)}</span></td>
          <td class="n">${fmt(e.qty)}</td>
          <td style="font-size:14px">${e.others.length ? e.others.map((o) => esc(o.name) + ' ' + (o.qty !== null ? fmt(o.qty) : (o.submitted ? '0' : 'ยังไม่นับ'))).join('<br>') : '-'}</td>
          <td class="n">${fmt(e.total)}</td><td class="n">${fmt(e.simlex)}</td>
          <td class="n"><b>${e.status === 'wait' ? '-' : fmtDiff(e.diff)}</b></td><td>${chip(e.status)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">ยังไม่มีรายการ</td></tr>'}</tbody>
      </table></div>
      <p class="muted" style="font-size:15px">ผลต่าง ±${s.tolerance} ชิ้นนับว่าตรงเฉพาะตอนสรุป % ส่วนยอดที่ PC ปรับใน SimLex ใช้ผลต่างจริงเสมอ สถานะ "รอไลน์อื่น" จะเทียบได้เมื่อทุกไลน์ที่มี Item นั้นส่งยอดครบ</p>
      <div class="row noprint" style="margin-top:16px">
        ${s.submitted_at
          ? `<div class="banner good" style="flex:1">ส่งยอดแล้ว ${esc(thTime(s.submitted_at))} (PC และหัวหน้าเห็นในหน้าสรุปได้ทันที)</div><button class="btn sec big" data-act="reopen">แก้ไขต่อ</button>`
          : `<button class="btn big" style="flex:1;background:${L.color}" data-act="submit">ส่งยอดไลน์นี้ (กดเมื่อนับครบแล้ว)</button>`}
        <button class="btn sec big" data-act="print">พิมพ์สรุป</button>
      </div>
    </div>`;
  }

  function render() {
    const app = $('#app');
    if (!S.meta) { app.innerHTML = '<div class="wrap">กำลังโหลด...</div>'; return; }
    app.innerHTML = { home: viewHome, lines: viewLines, count: viewCount, summary: viewSummary, lineall: viewLineAll }[S.view]();
    if (S.view === 'count') {
      const code = $('#code');
      if (code && !S.item && !code.disabled) code.focus({ preventScroll: true });
      else if (S.item && $('#qty') && !$('#qty').disabled) { const q = $('#qty'); q.focus({ preventScroll: true }); q.select(); }
      // พาไปที่ช่องที่ต้องใช้ต่อทันที: ยิงแล้วเลื่อนไปช่องจำนวน / บันทึกแล้วกลับไปช่องยิง
      if (S.item) { const p = $('#panel'); if (p) { const r = p.getBoundingClientRect(); if (r.top < 0 || r.bottom > window.innerHeight) p.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
      else if (S.scrollTop) { S.scrollTop = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }
  }

  // ---------- actions ----------
  async function lookup(raw, fromEntry) {
    const code = String(raw || '').trim();
    if (!code) return;
    if (M) {
      const it = localLookup(code);
      S.item = it;
      S.qty = it.mine !== null ? String(it.mine) : '';
      render();
      return;
    }
    try {
      const it = await api('/api/lookup?code=' + encodeURIComponent(code) + '&line=' + encodeURIComponent(S.line));
      S.item = it;
      S.qty = it.mine !== null ? String(it.mine) : '';
      render();
    } catch (e) { toast(e.message, true); }
  }

  async function save(mode) {
    if (!S.item || S.busy) return;
    const q = $('#qty') ? $('#qty').value.replace(/,/g, '').trim() : S.qty;
    if (q === '' || !/^\d+(\.\d{1,3})?$/.test(q)) { toast('ใส่จำนวนเป็นตัวเลขก่อน', true); const el = $('#qty'); if (el) el.focus(); return; }
    if (Number(q) >= 100000 && !(await H.confirm('ยอด ' + fmt(Number(q)) + ' ชิ้น สูงผิดปกติ (อาจยิง QR ลงช่องจำนวนโดยไม่ตั้งใจ) ยืนยันบันทึกยอดนี้ใช่ไหม', 'บันทึกยอดนี้'))) {
      const el = $('#qty'); if (el) { el.value = ''; el.focus(); } return;
    }
    if (M) {
      const code = S.item.code, k = code.toUpperCase();
      const old = M.counts[k] && M.counts[k][S.line] !== undefined ? M.counts[k][S.line] : null;
      const next = mode === 'add' && old !== null ? r3(old + Number(q)) : Number(q);
      (M.counts[k] = M.counts[k] || {})[S.line] = next;
      const e = localEntry(code, next);
      putEntry(e);
      enqueue({ line: S.line, code, qty: next, name: S.who, at: Date.now() });
      S.item = null; S.qty = ''; S.scrollTop = true;
      toast('บันทึกแล้ว ' + code + ' = ' + fmt(next) + (e.status === 'wait' ? ' (รอไลน์อื่น)' : (e.status === 'bad' ? ' (ยังไม่ตรง SimLex)' : '')), false);
      render();
      return;
    }
    S.busy = true;
    try {
      const code = S.item.code;
      const r = await api('/api/count', { method: 'POST', body: JSON.stringify({ line: S.line, code, qty: Number(q), mode, name: S.who }) });
      const list = S.lineData.entries.filter((e) => e.code.toUpperCase() !== r.entry.code.toUpperCase());
      list.unshift(r.entry);
      S.lineData.entries = list;
      S.item = null; S.qty = '';
      S.busy = false;
      const st = r.entry.status;
      toast('บันทึกแล้ว ' + code + ' = ' + fmt(r.saved) + (st === 'wait' ? ' (รอไลน์อื่น)' : (st === 'bad' ? ' (ยังไม่ตรง SimLex)' : '')), false);
      render();
    } catch (e) {
      S.busy = false;
      toast(e.message, true);
      if (e.data && e.data.error === 'submitted') route();
    }
  }

  async function camera() {
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices) {
      toast('เบราว์เซอร์นี้ยังสแกนด้วยกล้องไม่ได้ ใช้เครื่องยิงหรือพิมพ์รหัสแทน', true);
      return;
    }
    let stream, stop = false;
    const ov = document.createElement('div');
    ov.className = 'cam';
    ov.innerHTML = '<video playsinline muted></video><div class="bar2"><span>เล็งกล้องไปที่ QR ของ Item</span><button class="btn" style="background:#fff;color:#17406F">ปิดกล้อง</button></div>';
    document.body.appendChild(ov);
    const close = () => { stop = true; if (stream) stream.getTracks().forEach((t) => t.stop()); ov.remove(); };
    ov.querySelector('button').onclick = close;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      const video = ov.querySelector('video');
      video.srcObject = stream; await video.play();
      const det = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13', 'data_matrix'] });
      const tick = async () => {
        if (stop) return;
        try {
          const found = await det.detect(video);
          if (found.length && found[0].rawValue) { const v = found[0].rawValue; close(); lookup(v); return; }
        } catch (_) {}
        setTimeout(tick, 250);
      };
      tick();
    } catch (e) {
      close();
      toast('เปิดกล้องไม่ได้ (ต้องอนุญาตกล้อง และเปิดผ่าน https)', true);
    }
  }

  // ---------- เปลี่ยนรหัส (คีย์รหัสผิด เช่น -2 แทน -3) ----------
  function renameCandidates(cur) {
    if (!M) return [];
    const C = cur.toUpperCase(), base = C.replace(/-[^-]+$/, ''), root = C.split('-').slice(0, 3).join('-');
    const keys = {}; Object.keys(M.info).forEach((k) => { keys[k] = 1; }); Object.keys(M.stock).forEach((k) => { if (M.stock[k].qty !== 0) keys[k] = 1; });
    const score = (k) => (k.replace(/-[^-]+$/, '') === base || k.startsWith(C + '-') || C.startsWith(k + '-') ? 0 : k.startsWith(base) ? 1 : 2);
    return Object.keys(keys).filter((k) => k !== C && (k.startsWith(base) || k.startsWith(root) || C.startsWith(k + '-')))
      .map((k) => { const it = M.info[k], st = M.stock[k], per = M.counts[k] || {};
        return { k, code: (it && it.code) || (st && st.code) || k, name: (it && it.name) || (st && st.name) || '', inLine: !!(M.cand[k] && M.cand[k][S.line]), mine: per[S.line], s: score(k) }; })
      .sort((a, b) => a.s - b.s || (b.inLine - a.inLine) || (a.k < b.k ? -1 : 1)).slice(0, 14);
  }
  function modalBox(html) {
    return new Promise((resolve) => {
      const ov = document.createElement('div'); ov.className = 'modal-bg';
      ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true" style="max-width:560px">' + html + '</div>';
      document.body.appendChild(ov);
      const done = (v) => { ov.remove(); resolve(v); };
      ov.addEventListener('click', (e) => { const x = e.target.closest('[data-pick]'); if (x) done(x.dataset.pick); else if (e.target === ov || e.target.closest('[data-x=no]')) done(null); });
      ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && e.target.id === 'rn-in' && e.target.value.trim()) { e.preventDefault(); e.stopPropagation(); done(e.target.value.trim()); } });
      const inp = ov.querySelector('#rn-in'); if (inp) inp.focus();
      const ok = ov.querySelector('[data-x=ok]'); if (ok) ok.addEventListener('click', () => { const v = inp && inp.value.trim(); if (v) done(v); });
    });
  }
  async function renameFlow() {
    const it = S.item; if (!it || it.mine === null) return;
    const from = it.code, qty = it.mine, L = lineOf(S.line);
    const cands = renameCandidates(from);
    const list = cands.map((c) => `<button type="button" class="sugi" data-pick="${esc(c.code)}" style="min-height:52px"><b>${esc(c.code)}</b><span>${esc(c.name)}${c.inLine ? ' · อยู่ในไลน์นี้' : ''}${c.mine !== undefined ? ' · นับไว้แล้ว ' + fmt(c.mine) : ''}</span></button>`).join('');
    const to = await modalBox(`<h2 style="margin:0 0 4px;font-size:22px">เปลี่ยนรหัส</h2>
      <p style="margin:0 0 10px">รหัสเดิม <b>${esc(from)}</b> · ยอด <b>${fmt(qty)}</b> · ไลน์ ${esc(L.name)}</p>
      ${list ? `<div class="muted" style="margin-bottom:4px">รหัสที่ใกล้เคียง (แตะเพื่อเลือก)</div><div class="sug" style="position:static;max-height:46vh;border-width:1px;box-shadow:none">${list}</div>` : '<div class="muted">ไม่พบรหัสใกล้เคียง พิมพ์รหัสที่ถูกด้านล่าง</div>'}
      <label class="l" for="rn-in" style="margin-top:12px">หรือพิมพ์รหัสที่ถูก</label>
      <input id="rn-in" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="รหัสที่ถูกต้อง">
      <div class="row" style="gap:12px;margin-top:14px"><button type="button" class="btn sec big" style="flex:1" data-x="no">ยกเลิก</button><button type="button" class="btn big" style="flex:1" data-x="ok">ใช้รหัสที่พิมพ์</button></div>`);
    if (!to || to.toUpperCase() === from.toUpperCase()) return;
    const k = to.toUpperCase(), have = M && M.counts[k] && M.counts[k][S.line] !== undefined ? M.counts[k][S.line] : null;
    if (M && !M.info[k] && !M.stock[k] && !(await H.confirm('ไม่พบรหัส ' + to + ' ใน BOM และ STOCK PD2 ยืนยันใช้รหัสนี้ใช่ไหม', 'ใช้รหัสนี้'))) return;
    let mode = 'merge';
    if (have !== null) {
      const m = await modalBox(`<h2 style="margin:0 0 8px;font-size:22px">${esc(to)} มียอดในไลน์นี้อยู่แล้ว</h2>
        <p style="font-size:17px;margin:0 0 14px">ยอดเดิม ${fmt(have)} · ยอดที่จะย้ายมา ${fmt(qty)}</p>
        <div class="row" style="gap:10px"><button type="button" class="btn big" style="flex:1" data-pick="merge">บวกรวม = ${fmt(r3(have + qty))}</button>
        <button type="button" class="btn sec big" style="flex:1" data-pick="replace">แทนที่ = ${fmt(qty)}</button></div>
        <button type="button" class="btn ghost" style="margin-top:10px;width:100%;color:#555" data-x="no">ยกเลิก</button>`);
      if (!m) return; mode = m;
    }
    try {
      S.busy = true; render();
      await flushQueue();
      let done = null;
      try { done = await api('/api/count/rename', { method: 'POST', body: JSON.stringify({ line: S.line, from, to, mode, name: S.who }) }); }
      catch (e) {
        if (!(e.data && e.data.error === 'notfound')) throw e;
        // เซิร์ฟเวอร์รุ่นเก่ายังไม่มีคำสั่งเปลี่ยนรหัส: ตั้งยอดรหัสใหม่แล้วลบรหัสเดิม
        await api('/api/count', { method: 'POST', body: JSON.stringify({ line: S.line, code: to, qty: mode === 'replace' || have === null ? qty : r3(have + qty), mode: 'set', name: S.who }) });
        await api('/api/count?line=' + encodeURIComponent(S.line) + '&code=' + encodeURIComponent(from) + '&name=' + encodeURIComponent(S.who || ''), { method: 'DELETE' });
      }
      const newCode = (done && done.to) || to, nk = newCode.toUpperCase(), ok = from.toUpperCase();
      const val = have === null || mode === 'replace' ? qty : r3(have + qty);
      if (M) {
        if (M.counts[ok]) delete M.counts[ok][S.line];
        (M.counts[nk] = M.counts[nk] || {})[S.line] = val;
        const o = (M.order[S.line] = M.order[S.line] || []);
        const iOld = o.indexOf(ok);
        if (o.indexOf(nk) >= 0) { if (iOld >= 0) o.splice(iOld, 1); } else if (iOld >= 0) o[iOld] = nk; else o.push(nk);
      }
      S.lineData.entries = S.lineData.entries.filter((e) => e.code.toUpperCase() !== ok && e.code.toUpperCase() !== nk);
      if (M) putEntry(localEntry(newCode, val));
      S.item = null; S.busy = false;
      toast('เปลี่ยน ' + from + ' → ' + newCode + ' แล้ว (ยอด ' + fmt(val) + ')', false);
      render();
    } catch (e) { S.busy = false; render(); toast(e.message, true); }
  }

  // ---------- ลบรายการ (มีหน้าต่างยืนยันก่อน) ----------
  function askDelete(code, qty) {
    const ov = document.createElement('div');
    ov.className = 'modal-bg';
    ov.innerHTML = '<div class="modal confirm-del" role="dialog" aria-modal="true">' +
      '<h2 style="margin:0 0 8px;font-size:22px">ลบรายการนี้ใช่ไหม</h2>' +
      '<p style="font-size:18px;margin:0 0 4px"><b>' + esc(code) + '</b></p>' +
      '<p class="muted" style="margin:0 0 18px">ยอดที่นับไว้ ' + esc(fmt(Number(qty))) + ' ของไลน์ ' + esc(lineOf(S.line).name) + ' จะถูกลบ (ประวัติยังเก็บไว้ในหน้า PC)</p>' +
      '<div class="row" style="gap:12px"><button class="btn sec big" style="flex:1" data-x="no">ยกเลิก</button>' +
      '<button class="btn big" style="flex:1;background:#C62828" data-x="yes">ลบ</button></div></div>';
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', async (ev) => {
      const x = ev.target.closest('[data-x]');
      if (ev.target === ov || (x && x.dataset.x === 'no')) { close(); return; }
      if (!x || x.dataset.x !== 'yes') return;
      x.disabled = true; x.textContent = 'กำลังลบ...';
      try {
        await flushQueue();
        await api('/api/count?line=' + encodeURIComponent(S.line) + '&code=' + encodeURIComponent(code) + '&name=' + encodeURIComponent(S.who || ''), { method: 'DELETE' });
        close();
        toast('ลบ ' + code + ' แล้ว', false);
        if (S.item && S.item.code.toUpperCase() === code.toUpperCase()) S.item = null;
        if (M) {
          const k = code.toUpperCase(); if (M.counts[k]) delete M.counts[k][S.line];
          if (M.order[S.line]) M.order[S.line] = M.order[S.line].filter((x) => x !== k);
          S.lineData.entries = S.lineData.entries.filter((e) => e.code.toUpperCase() !== k);
          render();
        } else route();
      } catch (e) { close(); toast(e.message, true); }
    });
    ov.querySelector('[data-x="no"]').focus();
  }

  document.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'back') {
      if (S.view === 'lineall') { R = { view: 'count', line: S.line }; S.view = 'count'; render(); }
      else if (S.view === 'summary') nav('count', S.line);
      else if (S.view === 'count') nav('lines');
      else nav('home');
    } else if (act === 'go-lines') nav('lines');
    else if (act === 'pick-line') {
      const w = $('#who'); if (w) { S.who = w.value.trim().slice(0, 40); try { localStorage.setItem('who', S.who); } catch (_) {} }
      nav('count', b.dataset.line);
    } else if (act === 'ask-del') askDelete(b.dataset.code, b.dataset.qty);
    else if (act === 'rename') renameFlow();
    else if (act === 'open-entry') lookup(b.dataset.code, true);
    else if (act === 'save') save('set');
    else if (act === 'add') save('add');
    else if (act === 'retry') route();
    else if (act === 'line-all') { S.allFilter = 'all'; nav('lineall', S.line); window.scrollTo(0, 0); }
    else if (act === 'all-filter') { S.allFilter = b.dataset.f; render(); }
    else if (act === 'all-excel') exportLineAll();
    else if (act === 'all-pick') { const c = b.dataset.code; R = { view: 'count', line: S.line }; S.view = 'count'; render(); lookup(c); }
    else if (act === 'fil') { S.fil = b.dataset.f; paintList(); }
    else if (act === 'print-bad') { const el = $('#pbad'); if (el) { el.innerHTML = badSheet(); document.body.classList.add('print-bad'); window.print(); setTimeout(() => document.body.classList.remove('print-bad'), 500); } }
    else if (act === 'sug-pick') { const c = $('#code'); if (c) c.value = ''; hideSug(); lookup(b.dataset.code); }
    else if (act === 'camera') camera();
    else if (act === 'kbd') { S.kbd = !S.kbd; render(); const c = $('#code'); if (c) c.focus(); }
    else if (act === 'summary') nav('summary', S.line);
    else if (act === 'print') window.print();
    else if (act === 'submit') {
      if (!(await H.confirm('ส่งยอดไลน์นี้ใช่ไหม หลังส่งแล้วจะแก้ยอดไม่ได้จนกว่าจะกด "แก้ไขต่อ"', 'ส่งยอด'))) return;
      try {
        await flushQueue();
        await api('/api/line/' + S.line + '/submit', { method: 'POST', body: JSON.stringify({ name: S.who }) });
        toast('ส่งยอดแล้ว', false);
        route();
      } catch (e) {
        if (e.data && e.data.error === 'empty' && (await H.confirm('ไลน์นี้ยังไม่มีรายการนับเลย ยืนยันส่งว่า "ไม่มีของ" ใช่ไหม', 'ส่งว่าไม่มีของ'))) {
          try { await api('/api/line/' + S.line + '/submit', { method: 'POST', body: JSON.stringify({ name: S.who, confirmEmpty: true }) }); toast('ส่งยอดแล้ว', false); route(); } catch (e2) { toast(e2.message, true); }
        } else if (!(e.data && e.data.error === 'empty')) toast(e.message, true);
      }
    } else if (act === 'reopen') {
      try { await api('/api/line/' + S.line + '/reopen', { method: 'POST', body: JSON.stringify({ name: S.who }) }); toast('เปิดให้แก้ไขต่อแล้ว', false); route(); } catch (e) { toast(e.message, true); }
    }
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.target.id === 'code' && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { if (moveSug(ev.key === 'ArrowDown' ? 1 : -1)) ev.preventDefault(); return; }
    if (ev.target.id === 'code' && ev.key === 'Escape') { hideSug(); return; }
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'code') {
      ev.preventDefault();
      const pick = SUG.idx >= 0 && SUG.shown[SUG.idx] ? SUG.shown[SUG.idx].code : null;
      const v = pick || ev.target.value; ev.target.value = ''; hideSug(); lookup(v);
    }
    else if (ev.target.id === 'qty') { ev.preventDefault(); save('set'); }
  });
  // แตะรายการแนะนำแล้วช่องพิมพ์ไม่หลุดโฟกัส / แตะที่อื่นแล้วปิดรายการ
  document.addEventListener('mousedown', (ev) => { if (ev.target.closest('#sug')) ev.preventDefault(); else if (!ev.target.closest('#code')) hideSug(); });
  document.addEventListener('change', (ev) => {
    if (ev.target.id === 'sortby') { S.sort = ev.target.value; paintList(); }
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'lsearch') { S.q = ev.target.value; paintList(); return; }
    if (ev.target.id === 'code') { paintSug(ev.target.value); return; }
    if (ev.target.id === 'qty') {
      const v = ev.target.value.replace(/[^0-9.]/g, '');
      if (v !== ev.target.value) ev.target.value = v;
      S.qty = v;
    }
  });

  route();
}

          <div class="row"><button class="btn" data-act="export-mk">ดาวน์โหลดไฟล์ให้ MK</button>
          <button class="btn sec" data-act="export-adjust">ดาวน์โหลดรายการปรับยอด SimLex</button></div>
          ${S.exportInfo ? `<div class="banner good" style="margin-top:12px;font-weight:500">สร้างไฟล์ ${esc(S.exportInfo.filename)} แล้ว${S.exportInfo.base64 ? ' (ถ้าไม่เริ่มดาวน์โหลดเอง ให้กดลิงก์ด้านล่าง)' : ''}<br><a href="${esc(S.exportInfo.xlsxUrl)}" target="_blank" rel="noopener">ดาวน์โหลด .xlsx</a> &nbsp;·&nbsp; <a href="${esc(S.exportInfo.sheetUrl)}" target="_blank" rel="noopener">เปิดเป็น Google Sheets</a></div>` : ''}
          <p class="muted" style="font-size:15px;margin-bottom:0">ควรดาวน์โหลดหลังทุกไลน์ส่งยอดครบ (ตอนนี้ส่งแล้ว ${s.linesSubmitted}/5 ไลน์)</p>
        </div>
      </div>
      <div class="card"><h2 style="font-size:20px;margin-bottom:4px">รายการที่ไม่ตรง ${P.bad.length} Item (เรียงตามผลต่างมากสุด 60 ตัวแรก)</h2>
        <p class="muted" style="margin-top:0">ยอดรวมทุกไลน์เทียบ SimLex · กด "ตามรอย" เพื่อดูว่าควรไปตามต่อที่ไลน์ไหน · รายการทั้งหมดและใบพิมพ์อยู่ในแท็บ "ตรวจก่อนส่ง"</p>
        <div class="scroll-x"><table class="t"><thead><tr><th>Item</th><th class="n">SimLex</th><th class="n">นับรวม</th><th class="n">ผลต่าง</th><th>นับได้แยกไลน์</th><th></th></tr></thead>
        <tbody>${P.bad.slice(0, 60).map((x) => `<tr><td><b>${esc(x.code)}</b><br><span class="muted" style="font-size:14px">${esc(x.name)}</span></td>
          <td class="n">${fmt(x.sx)}</td><td class="n">${fmt(x.total)}</td><td class="n"><b style="color:#8F1D12">${fmtDiff(x.d)}</b></td>
          <td style="font-size:14px">${x.lines.map((l) => esc(P.lname(l)) + ' ' + fmt(x.per[l])).join(', ')}</td><td><button class="btn sec sm" data-trace="${esc(x.code)}">ตามรอย</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">ไม่มีรายการที่ไม่ตรง</td></tr>'}</tbody></table></div>
      </div>`;
  }

  // ---------- ตรวจก่อนส่ง: % รวมทุกไลน์ (Item ไม่ซ้ำ) ใช้ได้ตั้งแต่ไลน์ยังไม่กดส่ง เทียบตรงเป๊ะ (ส่วนต่าง = 0) ----------
  const r3 = (x) => Math.round(x * 1000) / 1000;
  function buildPre(m) {
    const info = {}, stock = {}, per = {}, order = {}, sub = m.submitted || {};
    m.items.forEach((r) => { info[r[0].toUpperCase()] = { code: r[0], name: r[1], process: r[3] }; });
    m.stock.forEach((r) => { stock[r[0].toUpperCase()] = { code: r[0], name: r[1], qty: Number(r[2]) }; });
    m.counts.forEach((r) => { const k = r[1].toUpperCase(); (per[k] = per[k] || {})[r[0]] = Number(r[2]); (order[r[0]] = order[r[0]] || []).push(k); });
    const lname = (id) => ((S.meta && S.meta.lines.find((l) => l.id === id)) || { name: id }).name;
    const items = Object.keys(per).map((k) => {
      const it = info[k], st = stock[k], p = per[k];
      let total = 0; Object.keys(p).forEach((l) => { total += p[l]; });
      total = r3(total);
      const sx = st ? st.qty : 0, d = r3(total - sx);
      return { k, code: (it && it.code) || (st && st.code) || k, name: (it && it.name) || (st && st.name) || '', process: it ? it.process : '',
        per: p, lines: Object.keys(p), total, simlex: st ? st.qty : null, sx, d, ok: d === 0 || Math.abs(d) === 1, exact: d === 0 };
    });
    const byK = {}; items.forEach((x) => { byK[x.k] = x; });
    const tol = Number(m.tolerance) || 0;
    const bad = items.filter((x) => !x.ok).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    const multi = items.filter((x) => x.lines.length > 1).length;
    const cand = {}; (m.cand || []).forEach((r) => { const k = r[1].toUpperCase(); (cand[k] = cand[k] || []).push(r[0]); });
    const notCountedList = Object.keys(stock).filter((k) => stock[k].qty !== 0 && !per[k])
      .map((k) => ({ code: stock[k].code, name: (info[k] && info[k].name) || stock[k].name || '', process: info[k] ? info[k].process : '', qty: stock[k].qty, lines: (cand[k] || []).map(lname) }))
      .sort((a, b) => Math.abs(b.qty) - Math.abs(a.qty));
    const notCounted = notCountedList.length;
    const lines = (S.meta ? S.meta.lines : []).map((L) => {
      const ks = order[L.id] || [];
      const rows = ks.map((k, i) => ({ seq: i + 1, x: byK[k], mine: per[k][L.id], others: Object.keys(per[k]).filter((l) => l !== L.id).map((l) => ({ name: lname(l), qty: per[k][l] })) }));
      const okN = rows.filter((r) => r.x.ok).length;
      return { L, rows, n: rows.length, ok: okN, bad: rows.length - okN, pct: rows.length ? Math.round(okN * 1000 / rows.length) / 10 : null, submitted: sub[L.id] || null };
    });
    // % หลักทุกหน้า = แบบไฟล์ TOTAL STOCK PD2: Item ที่นับ (ตัดตัวซ้ำ) ส่วนต่าง 0 หรือ ±1 พอดี นับว่าตรง
    const n = items.length, ok = n - bad.length, exact = items.filter((x) => x.exact).length;
    return { notCountedList, items, bad, lines, n, ok, pct: n ? Math.round(ok * 1000 / n) / 10 : null, exact, exactPct: n ? Math.round(exact * 1000 / n) / 10 : null, pm1: ok - exact, tol, multi, notCounted, lname };
  }
  // ---------- เบาะแสจากไฟล์ RE&IS (ประวัติรับ-จ่ายจาก SimLex) ----------
  // เวลาเก็บเป็นเลขวันแบบ Excel (เวลาตามนาฬิกาในไฟล์) ไม่ต้องแปลงโซนเวลา
  const RKEY = 'wipReis';
  S.reis = null; try { S.reis = JSON.parse(localStorage.getItem(RKEY) || 'null'); } catch (_) {}
  const serialToStr = (v) => { const d = new Date(Math.round((v - 25569) * 86400000)); const p = (n) => String(n).padStart(2, '0'); return `${p(d.getUTCDate())}/${p(d.getUTCMonth() + 1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; };
  const serialToInput = (v) => new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 16);
  const inputToSerial = (t) => Date.parse(t + ':00Z') / 86400000 + 25569;
  function toSerial(v) {
    if (typeof v === 'number') return v;
    if (v instanceof Date) return v.getTime() / 86400000 + 25569;
    const m = String(v || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) / 86400000 + 25569 : null;
  }
  async function loadReis(file) {
    say('กำลังอ่านไฟล์ RE&IS...');
    try {
      const wb = await H.readWorkbook(file);
      const rows = wb.rowsOf(wb.names[0]);
      const h = rows[0].map((x) => String(x || '').trim());
      const c = (name) => h.indexOf(name);
      const ci = { item: c('Item'), date: c('Receive / Issue Date'), qty: c('Receive / Issue Quantity'), loc: c('Location'), code: c('Receive / Issue Code'), no: c('Receive / Issue No.') };
      if (ci.item < 0 || ci.date < 0 || ci.qty < 0) throw new Error('ไฟล์นี้ไม่ใช่ RE&IS (ไม่พบคอลัมน์ Item / Receive / Issue Date / Receive / Issue Quantity)');
      const out = [];
      rows.slice(1).forEach((r) => {
        if (!r || !r[ci.item]) return;
        if (ci.loc >= 0 && String(r[ci.loc] || '').trim() !== 'PD2') return;
        const t = toSerial(r[ci.date]); if (t === null) return;
        out.push([String(r[ci.item]).trim(), t, String(r[ci.code] || ''), Number(r[ci.qty]) || 0, String(r[ci.no] || '')]);
      });
      if (!out.length) throw new Error('ไม่พบรายการของคลัง PD2 ในไฟล์');
      const last = Math.max(...out.map((r) => r[1])), day = Math.floor(last);
      S.reis = { name: file.name, rows: out, count: day + 8 / 24, sim: day + 8.5 / 24, first: Math.min(...out.map((r) => r[1])), last };
      try { localStorage.setItem(RKEY, JSON.stringify(S.reis)); } catch (_) {}
      say('อ่านไฟล์ RE&IS แล้ว: รับ-จ่ายของ PD2 ' + out.length + ' รายการ');
    } catch (e) { say(e.message, 'err'); }
  }
  function reisIndex() {
    const R = S.reis; if (!R) return null;
    if (R._idx) return R._idx;
    const by = {}; R.rows.forEach((r) => { (by[r[0].toUpperCase()] = by[r[0].toUpperCase()] || []).push(r); });
    Object.values(by).forEach((a) => a.sort((x, y) => x[1] - y[1]));
    Object.defineProperty(R, '_idx', { value: by, enumerable: false, writable: true });
    return by;
  }
  const sgnF = (x) => (x > 0 ? '+' : '') + fmt(x);
  // เบาะแสของ Item ที่ไม่ตรง: [{t: 'time'|'pair'|'sib'|'none', text, short}]
  function hintsOf(x, P) {
    const out = [];
    const by = reisIndex();
    if (by) {
      const mv = by[x.k] || [];
      const win = mv.filter((r) => r[1] >= S.reis.count && r[1] <= S.reis.sim);
      if (win.length) {
        const sum = Math.round(win.reduce((a, r) => a + r[3], 0) * 1000) / 1000;
        out.push({ t: 'time', short: `⏱ ${sgnF(sum)} ระหว่างนับ`, text: `มีรับ-จ่ายระหว่างเวลานับกับเวลาดึง SimLex: ${win.map((r) => `${r[2]} ${sgnF(r[3])} (${serialToStr(r[1]).slice(6)})`).join(', ')} · ถ้าของเคลื่อนก่อนนับ ส่วนต่างคือ ${sgnF(x.d)} · ถ้าเคลื่อนหลังนับ ส่วนต่างจริงคือ ${sgnF(Math.round((x.d + sum) * 1000) / 1000)}` });
      }
      if (!mv.length) out.push({ t: 'none', short: 'ไม่มีรับ-จ่ายทั้งเดือน', text: 'ไม่มีรับ-จ่ายของ PD2 ทั้งเดือน (ตามไฟล์ RE&IS) ยอด SimLex อาจค้างมาจากเดือนก่อน ควรนับซ้ำ' });
    }
    const base = (k) => k.replace(/-[^-]+$/, '');
    P.bad.forEach((y) => {
      if (y === x) return;
      const sib = base(y.k) === base(x.k) || y.k.startsWith(x.k + '-') || x.k.startsWith(y.k + '-');
      if (!sib || Math.sign(y.d) === Math.sign(x.d)) return;
      if (Math.abs(x.d + y.d) <= Math.max(1, Math.abs(x.d) * 0.05)) out.unshift({ t: 'pair', short: `↔ ${y.code} ${sgnF(y.d)}`, text: `อาจคีย์ผิดรหัส: ${y.code} ต่าง ${sgnF(y.d)} หักล้างกันพอดี ใช้ปุ่ม "เปลี่ยนรหัส" บนแท็บเล็ตแก้ได้` });
      else out.push({ t: 'sib', short: `รหัสพี่น้อง ${y.code} ${sgnF(y.d)}`, text: `รหัสพี่น้อง ${y.code} ต่าง ${sgnF(y.d)} (คนละทิศ) อาจเป็นของข้ามขั้นตอนที่ยังไม่โอนใน SimLex` });
    });
    return out;
  }
  function reisCard() {
    const R = S.reis;
    return `<div class="card" style="margin-bottom:18px"><div class="row" style="justify-content:space-between;align-items:flex-start">

  // ใบพิมพ์: หน้าแรกสรุปรวม แล้วไลน์ละ 1 ใบ (รูปแบบเดียวกับใบไม่ตรงบนแท็บเล็ต)

  // ---------- รายงานประจำเดือน (รูปแบบไฟล์ TOTAL STOCK PD2) + แนวโน้ม ----------
  // วิธีคิดแบบไฟล์ TOTAL: Balance = PD − SIMLEX, ต่าง ±1 พอดีไม่นับว่าผิด, % = จำนวนที่ Balance เป็น 0 ÷ จำนวน Item
  const okXl = (d) => d === 0 || Math.abs(d) === 1;
  // ผลเดือนก่อนๆ จากไฟล์ TOTAL STOCK PD2.xlsx (ชีต, จำนวน Item, ตรง)
  const HIST = [['28-02-25', 327, 114], ['31-03-25', 313, 130], ['30-04-25', 353, 176], ['30-05-25', 315, 145], ['29-06-25', 303, 162], ['30-07-25', 292, 169],
    ['29-08-25', 267, 185], ['30-09-25', 266, 192], ['31-10-25', 286, 192], ['31-10-25 (2)', 263, 213], ['24-12-25', 277, 198], ['29-01-26', 286, 215],
    ['27-02-26', 264, 201], ['31-03-26', 269, 174], ['30-04-26', 298, 225], ['29-05-26', 283, 215], ['29-06-26', 264, 191], ['22-07-26', 284, 242],
    ['31-08-26', 275, 218], ['29-09-26', 260, 187]];
  const ddmmyy = (d) => [d.getDate(), d.getMonth() + 1, d.getFullYear() % 100].map((x) => String(x).padStart(2, '0')).join('-');
  function reportDate() {
    const m = S.meta, iso = m && m.round && m.round.stock_uploaded_at;
    return S.repDate || (iso ? new Date(iso) : new Date()).toISOString().slice(0, 10);
  }
  async function loadTrendRounds() {
    const out = [];
    for (const r of (S.meta.rounds || []).slice().reverse()) {
      if (r.id === S.meta.round.id) continue;
      try { const d = await api('/api/dashboard?round=' + r.id); if (d.stats.finalCount) out.push({ label: r.label, n: d.stats.finalCount, ok: d.stats.ok + d.stats.tol, src: 'app' }); } catch (_) {}
    }
    return out;
  }
  function trendData() {
    const P = S.pre, rows = HIST.map(([label, n, ok]) => ({ label, n, ok, src: 'xls' })).concat(S.trendApp || []);
    if (P && P.n) {
      const ok = P.items.filter((x) => okXl(x.d)).length;
      rows.push({ label: ddmmyy(new Date(reportDate())) + ' (รอบนี้)', n: P.n, ok, src: 'now' });
    }
    rows.forEach((r) => { r.pct = Math.round(r.ok * 1000 / r.n) / 10; });
    return rows;
  }
  function trendSvg(rows) {
    const W = 1000, H = 300, L = 44, R = 16, T = 26, B = 52, iw = W - L - R, ih = H - T - B;
    const x = (i) => L + (rows.length === 1 ? iw / 2 : i * iw / (rows.length - 1)), y = (v) => T + ih - v / 100 * ih;
    const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8EF" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#6B7684">${v}%</text>`).join('');
    const pts = rows.map((r, i) => `${x(i)},${y(r.pct)}`).join(' ');
    const last = rows.length - 1;
    const marks = rows.map((r, i) => `<g class="tp"><circle cx="${x(i)}" cy="${y(r.pct)}" r="${r.src === 'now' ? 6 : 4.5}" fill="${r.src === 'now' ? '#C25E00' : '#17406F'}" stroke="#fff" stroke-width="2"/>

  function loadStyleXlsx() {
    if (window.__XLSX_STYLE__) return Promise.resolve();

      sc.onload = () => { window.__XLSX_STYLE__ = true; ok(); };

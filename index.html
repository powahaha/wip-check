  async function exportTotal() {
    const P = S.pre; if (!P || !P.n) { say('ยังไม่มียอดนับในรอบนี้', 'err'); return; }
    try {
      await loadStyleXlsx();
      const X = window.XLSX, name = ddmmyy(new Date(reportDate()));
      // เรียงแบบไฟล์เดิม: ตามไลน์ CNC → Friction → Robot → Assy → Hand Welding แล้วตามลำดับที่นับ (ตัวซ้ำเอาครั้งแรก)
      const seen = {}, list = [];
      ['CNC', 'FRI', 'RWD', 'ASS', 'HWD'].forEach((id) => { const l = P.lines.find((x) => x.L.id === id); if (l) l.rows.forEach((r) => { if (!seen[r.x.k]) { seen[r.x.k] = 1; list.push(r.x); } }); });
      P.items.forEach((x) => { if (!seen[x.k]) { seen[x.k] = 1; list.push(x); } });
      const n = list.length, last = 3 + n, ok = list.filter((x) => okXl(x.d)).length;
      const bd = { style: 'thin', color: { rgb: 'BFBFBF' } }, border = { top: bd, bottom: bd, left: bd, right: bd };
      const hd = { font: { bold: true }, alignment: { horizontal: 'center', vertical: 'center' }, border };
      const ws = {};
      const put = (a, c) => { ws[a] = c; };
      put('F1', { t: 'd', v: new Date(reportDate()), z: 'd/m/yyyy' });
      [['B2', 'ITEM'], ['C2', 'PART NO.'], ['D2', 'PART NAME'], ['E2', 'SIMLEX'], ['F2', 'PD'], ['G2', 'Balance']].forEach(([a, v]) => put(a, { t: 's', v, s: hd }));
      put('B3', { t: 'n', f: `MAX(B4:B${last})`, v: n, s: hd });
      put('C3', { t: 'n', f: `COUNTIF(G4:G${last},0)`, v: ok, s: hd });
      put('D3', { t: 'n', f: '(C3*100/B3)*0.01', v: ok / n, z: '0%', s: hd });
      put('E3', { t: 's', v: 'STOCK', s: hd }); put('F3', { t: 's', v: 'CHECK', s: hd });
      put('G3', { t: 'n', f: `SUM(G4:G${last})`, v: 0, z: '0', s: hd });
      put('L3', { t: 's', v: ' +1-1 ไม่นำมาคำนวน % ' });
      const red = '0_ ;[Red]\\-0\\ ';
      let sumG = 0;
      list.forEach((x, i) => {
        const r = 4 + i, d = x.d, adj = d === -1 ? 1 : d === 1 ? -1 : 0, g = Math.round((d + adj) * 1000) / 1000; sumG += g;
        const hl = adj !== 0 ? { fill: { fgColor: { rgb: 'FFFF00' } } } : {};
        put('B' + r, { t: 'n', v: i + 1, s: { border, alignment: { horizontal: 'center' } } });
        put('C' + r, { t: 's', v: x.code, s: { border } });
        put('D' + r, { t: 's', v: x.name || '', s: { border } });
        put('E' + r, { t: 'n', v: x.sx, z: '0', s: { border } });
        put('F' + r, { t: 'n', v: x.total, z: '0', s: Object.assign({ border }, hl) });
        put('G' + r, { t: 'n', f: `ROUND(F${r}-E${r},3)+L${r}`, v: g, z: red, s: { border, font: g !== 0 ? { bold: true } : {} } });
        put('L' + r, { t: 'n', f: `IFERROR(IF(ROUND(F${r}-E${r},3)=-1,1,IF(ROUND(F${r}-E${r},3)=1,-1,0)),0)`, v: adj, z: red });
      });
      ws.G3.v = Math.round(sumG * 1000) / 1000;
      ws['!ref'] = 'B1:L' + last;
      ws['!cols'] = [{ wch: 2 }, { wch: 8 }, { wch: 30.9 }, { wch: 34 }, { wch: 10.6 }, { wch: 11.3 }, { wch: 9.6 }, { wch: 6 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 7.5 }];
      const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, name);
      X.writeFile(wb, 'WIP ' + name + '.xlsx');
      say('ดาวน์โหลดชีต ' + name + ' แล้ว (' + n + ' Item, ตรง ' + Math.round(ok * 1000 / n) / 10 + '%) · เปิดแล้วคลิกขวาที่ชื่อชีต → ย้ายหรือคัดลอก ไปไว้ในไฟล์ TOTAL STOCK PD2');
    } catch (e) { say(e.message, 'err'); }
  }

  async function upload(kind) {
    const input = $(kind === 'bom' ? '#bomfile' : '#stockfile');
    const file = input && input.files[0];
    if (!file) { say('ยังไม่ได้เลือกไฟล์', 'err'); return; }
    if (!/\.xlsx$/i.test(file.name)) { say('ใช้ได้เฉพาะไฟล์ .xlsx', 'err'); return; }
    say('กำลังอ่านไฟล์และอัปโหลด... (ไฟล์ใหญ่อาจใช้เวลาสักครู่)');
    try {
      const wb = await H.readWorkbook(file);
      let r;
      if (kind === 'bom') {
        const parsed = Parse.parseBom(wb.names, wb.rowsOf);
        r = await api('/api/admin/bom', { method: 'POST', body: JSON.stringify({ lines: parsed.lines }) });
        say('นำเข้า BOM แล้ว ' + r.items + ' Item (' + Object.entries(r.perLine).map(([l, n]) => l + ' ' + n).join(', ') + ')');
      } else {
        const parsed = Parse.parseStock(wb.names, wb.rowsOf);
        r = await api('/api/admin/stock', { method: 'POST', body: JSON.stringify({ items: parsed.items, file: file.name }) });
        say('อัปโหลด STOCK PD2 แล้ว ' + r.items + ' รายการ (มียอด ' + r.nonZero + ' รายการ, ติดลบ ' + r.negative + ' รายการ)');
      }
      if (input) input.value = '';
      await load();
    } catch (e) { say(e.message, 'err'); }
  }

  async function exportFile(kind) {
    say('กำลังสร้างไฟล์... (ครั้งแรกอาจใช้เวลา 5-15 วินาที และมีหน้าต่างขออนุญาตของ Google)');
    try {
      const r = await api('/api/export/' + kind + rq());
      S.exportInfo = r;
      if (r.base64) { try { H.download(r.base64, r.filename); } catch (_) {} }
      say('สร้างไฟล์ ' + r.filename + ' แล้ว');
    } catch (e) { say(e.message, 'err'); }
  }

  document.addEventListener('click', async (ev) => {
    const tab = ev.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; load(); return; }
    const tr = ev.target.closest('[data-trace]');
    if (tr) {
      S.modal = 'loading'; render();
      try { S.modal = await api('/api/trace?code=' + encodeURIComponent(tr.dataset.trace) + rqa()); } catch (e) { S.modal = null; say(e.message, 'err'); }
      render(); return;
    }
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'close-modal') { if (ev.target.closest('.modal') && !ev.target.closest('button')) return; S.modal = null; render(); }
    else if (act === 'search') { S.q = $('#q').value; S.status = $('#st').value; load(); }
    else if (act === 'up-bom') upload('bom');
    else if (act === 'print-all-bad') printBad('');
    else if (act === 'export-total') exportTotal();
    else if (act === 'print-notcounted') printNotCounted();
    else if (act === 'reis-clear') { S.reis = null; try { localStorage.removeItem(RKEY); } catch (_) {} render(); }
    else if (act === 'print-line-bad') printBad(b.dataset.line);
    else if (act === 'export-mk') exportFile('mk');
    else if (act === 'export-adjust') exportFile('adjust');
    else if (act === 'up-stock') upload('stock');
    else if (act === 'save-tol') {
      try { await api('/api/admin/tolerance', { method: 'POST', body: JSON.stringify({ tolerance: Number($('#tol').value) }) }); say('บันทึกค่าเผื่อแล้ว'); load(); } catch (e) { say(e.message, 'err'); }
    } else if (act === 'new-round') {
      if (!(await H.confirm('ปิดรอบ ' + S.meta.round.label + ' และเปิดรอบใหม่ใช่ไหม ปิดแล้วแก้ยอดรอบเก่าไม่ได้', 'ปิดรอบและเปิดรอบใหม่', true))) return;
      try { await api('/api/admin/round', { method: 'POST', body: JSON.stringify({ label: $('#rlabel').value }) }); S.roundId = ''; say('เปิดรอบใหม่แล้ว อย่าลืมอัปโหลด STOCK PD2 ใหม่'); load(); } catch (e) { say(e.message, 'err'); }
    }
  });
  document.addEventListener('change', (ev) => { if (ev.target.id === 'round') { S.roundId = ev.target.value; load(); } if (ev.target.id === 'preline') { S.preLine = ev.target.value; render(); } if (ev.target.id === 'repdate') { S.repDate = ev.target.value; render(); }
    if (ev.target.id === 'reisfile' && ev.target.files[0]) { loadReis(ev.target.files[0]).then(render); }
    if ((ev.target.id === 'reis-count' || ev.target.id === 'reis-sim') && S.reis && ev.target.value) { S.reis[ev.target.id === 'reis-count' ? 'count' : 'sim'] = inputToSerial(ev.target.value); try { localStorage.setItem(RKEY, JSON.stringify(S.reis)); } catch (_) {} render(); } });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'q') { S.q = ev.target.value; S.status = $('#st').value; load(); } });

  load();
}

if (!window.__NOCONFIG__) { if (window.__PAGE__ === 'pc') startPc(); else startApp(); }
</script>
</body>
</html>
